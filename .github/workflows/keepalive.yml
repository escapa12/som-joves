name: Keep Supabase awake
# Free-tier Supabase pauses after ~7 days without activity. Ping it every 3 days.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  actions: write # to re-enable this workflow (GitHub disables schedules after 60 days without commits)
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
